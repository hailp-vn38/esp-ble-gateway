    <!-- MODAL: ADD DEVICE -->
    <div id="modal-add-device" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity opacity-0" id="modal-backdrop" onclick="ui.closeModal()"></div>
        
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md transform transition-all scale-95 opacity-0 z-10 flex flex-col max-h-[90vh]" id="modal-content">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-2xl">
                <h3 class="text-lg font-bold text-gray-900 flex items-center">
                    <i class="ph ph-plus-circle text-brand-600 mr-2 text-xl"></i>
                    Add New Device
                </h3>
                <button onclick="ui.closeModal()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-1.5 rounded-md transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto">
                <p class="text-sm text-gray-600 mb-6">You are adding a new BLE device to the gateway. Please assign a friendly name to identify it easily.</p>
                
                <!-- Target Device Info -->
                <div class="bg-gray-50 rounded-lg p-4 border border-gray-100 mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Device Info</span>
                        <span class="text-xs font-mono bg-white px-2 py-0.5 rounded border border-gray-200 text-gray-600" id="modal-dev-mac">00:00:00:00:00</span>
                    </div>
                    <div class="font-medium text-gray-900" id="modal-dev-name">Unknown Device</div>
                    <div class="flex items-center mt-2 text-xs text-gray-500">
                        <i class="ph ph-wifi-high mr-1 text-green-500"></i>
                        RSSI: <span id="modal-dev-rssi" class="ml-1 font-mono">-0 dBm</span>
                    </div>
                </div>

                <!-- Input Form -->
                <div class="space-y-4">
                    <div>
                        <label for="input-custom-name" class="block text-sm font-medium text-gray-700 mb-1">Custom Name <span class="text-red-500">*</span></label>
                        <input type="text" id="input-custom-name" placeholder="e.g., Living Room Sensor" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow" autocomplete="off">
                    </div>
                </div>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl flex justify-end gap-3 shrink-0">
                <button onclick="ui.closeModal()" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors font-medium text-sm">Cancel</button>
                <button id="btn-confirm-add" onclick="devices.addDeviceFromModal()" class="px-6 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors shadow-sm font-medium text-sm flex items-center">
                    <i class="ph ph-check-circle mr-1.5 text-lg"></i> Save Device
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: EDIT DEVICE -->
    <div id="modal-edit-device" class="fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-edit-title">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity opacity-0" id="modal-edit-backdrop" onclick="ui.closeEditModal()"></div>
        
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md transform transition-all scale-95 opacity-0 z-10 flex flex-col max-h-[90vh]" id="modal-edit-content">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-2xl">
                <h3 id="modal-edit-title" class="text-lg font-bold text-gray-900 flex items-center">
                    <i class="ph ph-pencil-simple text-brand-600 mr-2 text-xl"></i>
                    <span data-i18n="device_detail.edit_title">Edit Device</span>
                </h3>
                <button type="button" onclick="ui.closeEditModal()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-1.5 rounded-md transition-colors" aria-label="Close edit device dialog">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            <form id="form-edit-device" onsubmit="devices.saveEdit(event)">
                <div class="p-6 overflow-y-auto">
                    <p data-i18n="device_detail.edit_desc" class="text-sm text-gray-500 mb-6">Update the display name for this device.</p>
                    <div class="space-y-4">
                        <div>
                            <label for="input-edit-name" class="block text-sm font-medium text-gray-700 mb-1"><span data-i18n="device_detail.name">Device Name</span> <span class="text-red-500">*</span></label>
                            <input type="text" id="input-edit-name" maxlength="31" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow" autocomplete="off" placeholder="e.g., Living Room Sensor">
                            <p data-i18n="device_detail.name_hint" class="text-xs text-gray-500 mt-1">Maximum 31 characters.</p>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl flex justify-end gap-3 shrink-0">
                    <button type="button" onclick="ui.closeEditModal()" data-i18n="device_detail.cancel" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors font-medium text-sm">Cancel</button>
                    <button id="btn-save-edit" type="submit" class="px-6 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors shadow-sm font-medium text-sm flex items-center">
                        <i class="ph ph-floppy-disk mr-1.5 text-lg"></i> <span data-i18n="device_detail.save">Save Changes</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
