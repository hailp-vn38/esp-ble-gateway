<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 BLE Gateway</title>
    <link href="/dashboard.css" rel="stylesheet">
    <link href="/icons.css" rel="stylesheet">
    <style>
        /* Modal transition */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 0.2s, transform 0.2s; }
        .modal-leave { opacity: 1; transform: scale(1); }
        .modal-leave-active { opacity: 0; transform: scale(0.95); transition: opacity 0.2s, transform 0.2s; }
        
        /* Pulse animation for scanning */
        @keyframes radar-ping {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }
        .animate-radar {
            animation: radar-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        .mcp-capacity { white-space: nowrap; }
        .settings-switch {
            position: relative; display: inline-flex; width: 2.75rem; height: 1.5rem;
            cursor: pointer;
        }
        .settings-switch input {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        .settings-switch-track {
            width: 100%; height: 100%; border-radius: 9999px; background: #d1d5db;
            transition: background-color 150ms ease;
        }
        .settings-switch-track::after {
            content: ''; position: absolute; width: 1.125rem; height: 1.125rem;
            top: 0.1875rem; left: 0.1875rem; border-radius: 9999px; background: white;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.2); transition: transform 150ms ease;
        }
        .settings-switch input:checked + .settings-switch-track { background: #0284c7; }
        .settings-switch input:checked + .settings-switch-track::after { transform: translateX(1.25rem); }
        .settings-switch input:focus-visible + .settings-switch-track {
            outline: 2px solid #0ea5e9; outline-offset: 2px;
        }
        .settings-switch input:disabled + .settings-switch-track { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans h-screen flex overflow-hidden selection:bg-brand-500 selection:text-white">

    <!-- @include partials/sidebar.html -->
    <!-- @include partials/modals.html -->

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="md:hidden h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 z-10 flex-shrink-0">
            <div class="flex items-center">
                <i class="ph ph-cpu text-brand-600 text-xl mr-2"></i>
                <span class="font-bold text-gray-800">ESP32 Gateway</span>
            </div>
            <button onclick="nav.toggleSidebar()" class="text-gray-600 hover:text-brand-600 focus:outline-none p-2 bg-gray-100 rounded-md">
                <i class="ph ph-list text-2xl"></i>
            </button>
        </header>

        <!-- Overlay for mobile sidebar -->
        <div id="mobile-overlay" onclick="nav.toggleSidebar()" class="fixed inset-0 bg-gray-900/50 z-10 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

        <!-- Scrollable View Container -->
        <div class="flex-1 overflow-y-auto bg-gray-50/50 p-4 md:p-8 relative w-full">
            <!-- Realtime Degraded Banner -->
            <div id="realtime-degraded-banner"
                 class="hidden mb-4 rounded-lg border border-amber-200
                        bg-amber-50 p-3 text-sm text-amber-800"
                 role="status">
                Realtime connection unavailable.
                Showing the last synchronized state.
            </div>

            <!-- @include views/devices.html -->
            <!-- @include views/device_detail.html -->
            <!-- @include views/scanner.html -->
            <!-- @include views/settings.html -->
        </div>
    </main>

    <!-- @include partials/restart_overlay.html -->

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
    <!-- @js core/state.js -->
    <!-- @js core/ui.js -->
    <!-- @js core/i18n.js -->
    <!-- @js core/events.js -->
    <!-- @js core/api.js -->
    <!-- @js core/nav.js -->
    <!-- @js features/devices.js -->
    <!-- @js features/scanner.js -->
    <!-- @js features/mcp_exposure.js -->
    <!-- @js features/settings.js -->

    // --- Initialization ---
    const initialRoute = nav.getRoute();
    const initialTab = initialRoute
        ? (initialRoute.tab === 'device-detail' ? 'devices' : initialRoute.tab)
        : state.activeTab;
    nav.switchTab(initialTab, false);

    window.addEventListener('hashchange', () => {
        if (state.devicesLoaded) nav.restoreRoute();
    });

    window.addEventListener('DOMContentLoaded', async () => {
        await Promise.all([devices.load(), settings.load()]);
        if (state.devicesLoaded) nav.restoreRoute();
    });
    </script>
</body>
</html>
