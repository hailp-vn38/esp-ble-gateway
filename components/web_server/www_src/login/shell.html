<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Gateway - Login</title>
    <link href="/dashboard.css" rel="stylesheet">
    <link href="/icons.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex items-center justify-center selection:bg-brand-500 selection:text-white">
    <div class="w-full max-w-sm mx-4">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-50 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="ph ph-cpu text-brand-600 text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">ESP32 Gateway</h1>
                <p class="text-gray-500 text-sm mt-1">Sign in to continue</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow"
                        placeholder="Enter username">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow"
                        placeholder="Enter password">
                </div>
                <div id="error-message" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2"></div>
                <button type="submit" id="btn-login"
                    class="w-full px-4 py-2.5 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors shadow-sm font-medium flex items-center justify-center">
                    <span id="btn-login-text">Sign In</span>
                    <i id="btn-login-spinner" class="ph ph-spinner animate-spin ml-2 hidden"></i>
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-gray-400 mt-6">This gateway uses HTTP. Use only on a trusted local network.</p>
    </div>

    <script src="/shared/common.js"></script>
    <script src="/shared/i18n.js"></script>
    <script src="/login/login.js"></script>
</body>
</html>
